
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёт Несытовой К.</title>
    <link rel="stylesheet" href="../../styles.css"> 
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg" />

</head>
<body>

    <section class="wrapper">
        <nav class="page-nav">
            <a href="../../index.html" class="btn">На главную</a>
        </nav>
        <h1>Калькулятор вкладов</h1>

        <div class="card calculator-wrapper">
            <form class="card form" id="form">
                <div class="form-field">
                    <label for="type">Вид вклада</label>
                    <select 
                    id="type" 
                    name="type" 
                    placeholder="Вид вклада"
                    required>
                        <option value="replenishable">
                            Пополняемый
                        </option>
                        <option value="fixed">
                            Срочный
                        </option>
                    </select>
                </div>
            
                <div class="form-field">
                    <label for="period">Срок вклада:</label>
                    <select 
                        id="period"
                        name="period"
                        placeholder="Срок вклада"
                        required>           
                    </select>
                </div>

                <div class="form-field">
                    <label for="amount">Сумма вклада:</label>
                    <input 
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Сумма, руб"
                        min="0"
                        required>
                </div>
            
                <input type="submit" value="Рассчитать" class="btn submit-button">
            </form>


            <div class="card hidden calc-info-wrapper" id="result">
                <p id="deposit-info" class="calc-info"></p>
                <p id="deposit-total" class="calc-info"></p>
            </div>
        </div>

    </section>
<script src="calculator.js"></script>
</body>

</html>
